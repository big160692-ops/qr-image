<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surprise</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body {
      align-items: center;
      background: #080808;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 1rem;
      box-sizing: border-box;
    }
    img { display: block; height: auto; max-height: 75vh; max-width: 100%; }
    button {
      background: #b20d20;
      border: 0;
      border-radius: .5rem;
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: .8rem 1.2rem;
    }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
  </style>
</head>
<body>
  <img src="jumpscare.gif" alt="Animated horror illustration">
  <button id="sound" type="button">Play sound effect</button>
  <audio id="audio" preload="auto" src="jumpscare.mp3"></audio>
  <script>
    const audio = document.querySelector("#audio");
    const button = document.querySelector("#sound");
    button.addEventListener("click", async () => {
      audio.currentTime = 0;
      try {
        await audio.play();
      } catch (error) {
        button.textContent = "Could not play audio — tap to try again";
        console.error("Audio playback failed:", error);
        return;
      }
      button.textContent = "Replay sound effect";
    });
  </script>
</body>
</html>
