<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surprise</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body {
      align-items: center;
      background: #080808;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 1rem;
      box-sizing: border-box;
    }
    img { display: block; height: auto; max-height: 75vh; max-width: 100%; }
  </style>
</head>
<body>
  <img src="jumpscare.gif" alt="Animated horror illustration">
  <audio id="audio" preload="auto" src="jumpscare.mp3"></audio>
  <script>
    const audio = document.querySelector("#audio");
    audio.play().catch((error) => {
      console.warn("The browser blocked audio autoplay:", error);
    });
  </script>
</body>
</html>
