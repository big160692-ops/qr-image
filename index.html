<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surprise</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body {
      align-items: center;
      background: #080808;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 1rem;
      box-sizing: border-box;
      cursor: pointer;
    }
    img { display: block; height: auto; max-height: 75vh; max-width: 100%; }
    p { margin: 0; text-align: center; }
  </style>
</head>
<body>
  <img src="jumpscare.gif" alt="Animated horror illustration">
  <p id="hint">Tap anywhere for sound</p>
  <audio id="audio" preload="auto" playsinline src="jumpscare.mp3"></audio>
  <script>
    const audio = document.querySelector("#audio");
    const hint = document.querySelector("#hint");

    audio.play().then(() => {
      hint.hidden = true;
    }).catch(() => {
      document.addEventListener("click", () => {
        audio.play().then(() => {
          hint.hidden = true;
        }).catch((error) => {
          hint.textContent = "Sound could not play in this browser";
          console.error("Audio playback failed:", error);
        });
      }, { once: true });
    });
  </script>
</body>
</html>
